[project]
name = "system-design-studio-backend"
version = "0.1.0"
description = "FastAPI backend for System Design Studio"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.116.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI intentionally uses Depends() in parameter defaults.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
