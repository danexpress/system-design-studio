name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Lint and test backend
        working-directory: backend
        run: |
          uv run ruff format --check app tests integration_tests
          uv run ruff check app tests integration_tests
          uv run pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build:static

  system-tests:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    env:
      PORT: "18085"
      POSTGRES_PASSWORD: ci-password
      JWT_SECRET: ci-secret-with-more-than-thirty-two-characters
      COMPOSE_PROJECT_NAME: system-design-studio-ci
      TEST_BASE_URL: http://127.0.0.1:18085
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        run: |
          cd backend && uv sync --locked
          cd ../e2e && npm ci
          npx playwright install --with-deps chromium
      - name: Build and start Docker Compose stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Run API integration tests
        working-directory: backend
        env:
          INTEGRATION_BASE_URL: ${{ env.TEST_BASE_URL }}
          INTEGRATION_COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
        run: uv run pytest integration_tests -m integration
      - name: Run browser end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ env.TEST_BASE_URL }}
        run: npm test
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: system-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - uses: docker/setup-buildx-action@v4
      - name: Deploy CloudFormation stack
        run: make aws-deploy
      - name: Validate deployment health
        run: |
          app_url="$(aws cloudformation describe-stacks \
            --stack-name system-design-studio \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue" \
            --output text)"
          for attempt in {1..30}; do
            if response="$(curl --fail --silent --show-error "${app_url}/api/health")" && \
              [[ "$response" == '{"status":"ok"}' ]]; then
              echo "Deployment is healthy at ${app_url}"
              exit 0
            fi
            echo "Health check attempt ${attempt}/30 failed; retrying..."
            sleep 10
          done
          echo "Deployment health check failed at ${app_url}" >&2
          exit 1
